# This is a basic workflow to help you get started with Actions

name: Test User Infput workflow
on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
    inputs:
      number1: 
        description: 'First number'  #Meaning- Display message.
        default: '0'    #Meaning- Default value if no value is provided. 
        required: true  #Meaning- Input is mandatory, cant be blank. 
      number2:
        description: 'Second number'
        default: '0'
        required: true
        
jobs:
  # This workflow contains a single job called "add_numbers"
  add_numbers:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: add numbers
        id: sum
        run: echo "::set-output name=sum::$((${{inputs.number1}} + ${{inputs.number2}}))"

      - name: Display sum
        run: echo "The sum of ${{inputs.number1}} and ${{inputs.number2}} is ${{steps.sum.outpus.sum}}"

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
